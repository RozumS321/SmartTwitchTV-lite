# Builds the Android TV APK (com.fgl27.twitch.debug, installs next to the original app) and publishes it as a
# GitHub release "apk-<version code>" with the asset SmartTwitchTV-lite.apk; the app's update check offers the
# latest release (app/general/version.js is stamped by the Pages workflow, which runs after this one).
# Every build is signed with the key from the repository secrets SIGN_KEYSTORE_BASE64 / SIGN_STORE_PASSWORD
# (alias "smarttwitchtv-lite"), so updates install over the previous APK. Without those secrets the APK is only
# attached to the run and no release is made.
name: APK

on:
    push:
        branches: [master]
        paths:
            - 'apk/**'
            - '.github/workflows/apk.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: apk
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
            SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
            SIGN_KEY_ALIAS: smarttwitchtv-lite
        steps:
            # apk/settings.gradle expects the modified AndroidX Media next to the project: ../../media from apk/
            - uses: actions/checkout@v4
              with:
                  path: SmartTwitchTV

            - uses: actions/checkout@v4
              with:
                  repository: fgl27/media
                  ref: release
                  path: media

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            # Version code: above the original app's 379 and growing with every run
            - name: Version code
              id: version
              run: |
                  code=$((400 + GITHUB_RUN_NUMBER))
                  sed -i -E "s/(publishVersionCode\s*:\s*)[0-9]+/\1$code/" SmartTwitchTV/apk/versions.gradle
                  grep publishVersionCode SmartTwitchTV/apk/versions.gradle
                  echo "code=$code" >> "$GITHUB_OUTPUT"

            - name: Signing key
              if: env.SIGN_KEYSTORE_BASE64 != ''
              run: |
                  echo "$SIGN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sign.p12"
                  echo "SIGN_STORE_FILE=$RUNNER_TEMP/sign.p12" >> "$GITHUB_ENV"

            - name: Build
              working-directory: SmartTwitchTV/apk
              run: |
                  chmod +x gradlew
                  ./gradlew assembleDebug --no-daemon
                  cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/SmartTwitchTV-lite.apk"

            - uses: actions/upload-artifact@v4
              with:
                  name: SmartTwitchTV-lite-apk
                  path: ${{ runner.temp }}/SmartTwitchTV-lite.apk

            - name: Release
              if: env.SIGN_KEYSTORE_BASE64 != ''
              working-directory: SmartTwitchTV
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "apk-${{ steps.version.outputs.code }}" "$RUNNER_TEMP/SmartTwitchTV-lite.apk" \
                      --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                      --title "APK 3.0.${{ steps.version.outputs.code }}" \
                      --notes "$(git log -1 --format=%B)" --latest
