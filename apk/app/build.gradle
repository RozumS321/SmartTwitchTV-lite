apply from: '../versions.gradle'
apply plugin: 'com.android.application'

//No Firebase (Crashlytics / Analytics) in this fork

android {
    namespace "com.fgl27.twitch"
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.fgl27.twitch"

        minSdkVersion 21
        targetSdkVersion 35
        compileSdk 35

        versionCode versions.publishVersionCode
        versionName versions.publishVersion + versions.publishVersionCode

    }

    //The APK workflow signs every build with the same key (repository secrets, see .github/workflows/apk.yml),
    //an in-app update only installs over an APK signed with the same key. Local builds keep the default debug key.
    def forkStoreFile = System.getenv('SIGN_STORE_FILE')

    signingConfigs {
        fork {
            if (forkStoreFile) {
                storeFile file(forkStoreFile)
                storeType 'pkcs12'
                storePassword System.getenv('SIGN_STORE_PASSWORD')
                keyAlias System.getenv('SIGN_KEY_ALIAS')
                keyPassword System.getenv('SIGN_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles = [
                    getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
            ]
        }
        debug {
            applicationIdSuffix ".debug"
            if (forkStoreFile) signingConfig signingConfigs.fork
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    productFlavors {
    }

    lint {
        abortOnError false
        disable 'SetJavaScriptEnabled', 'GoogleAppIndexingWarning', 'IconMissingDensityFolder', 'IconLauncherShape', 'RtlHardcoded', 'ObsoleteLintCustomCheck'
        lintConfig file('lint.xml')
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //Exoplayer
    implementation project(':media3-lib-exoplayer')
    implementation project(':media3-lib-ui')
    implementation project(':media3-lib-exoplayer-hls')
    //implementation project(':media-lib-decoder-av1')


    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.GCX-HCI:tray:v0.12.0'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'

    // coreLibraryDesugaringEnabled
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

}
