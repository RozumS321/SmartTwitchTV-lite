                left: 50%;
                width: 64vw;
                margin: 0;
                box-sizing: border-box;
                padding: 4vh 4vh 3vh;
                border-radius: 2.4vh;
                border: 1px solid var(--tv-line);
                background-color: var(--tv-panel);
                box-shadow: 0 4vh 10vh rgba(0, 0, 0, 0.6);
                text-align: left !important;
                transform: translate(-50%, -50%);
                animation: tv_dialog_in 260ms cubic-bezier(0.16, 1.2, 0.3, 1) both;
            }

            @keyframes tv_dialog_in {
                from {
                    opacity: 0;
                    transform: translate(-50%, -47%) scale(0.97);
                }

                to {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
            }

            #dialog_thumb_opt .strokedeline {
                text-shadow: none;
            }

            #dialog_opt_text {
                width: auto;
                margin: 0 0 2.4vh 1.6vh;
                font-family: 'Space Grotesk', 'Manrope', sans-serif;
                font-weight: 700;
                font-size: 3vh;
                color: var(--tv-text);
            }

            #dialog_thumb_opt .hist_div {
                display: flex;
                align-items: center;
                gap: 1vh;
                width: 100%;
                height: 5.4vh;
                margin: 0.4vh 0;
                padding: 0 1.6vh;
                box-sizing: border-box;
                border: 0;
                border-radius: 1.4vh;
                line-height: normal;
                font-size: 2vh;
            }

            /* rows switched off for the card are hidden with .hideimp, keep that winning over display: flex */
            #dialog_thumb_opt .hist_div.hideimp {
                display: none;
            }

            #dialog_thumb_opt .hist_name {
                flex: 1;
                width: auto;
                margin: 0;
                font-weight: 600;
                font-size: 2vh;
                color: var(--tv-text-2);
            }

            #dialog_thumb_opt .hist_value {
                width: auto;
                min-width: 16vw;
                margin: 0;
                border: 0;
                text-align: right;
                font-weight: 600;
                font-size: 1.9vh;
                line-height: normal;
                color: var(--tv-muted);
            }

            #dialog_thumb_opt .settings_div_focus .hist_name {
                color: var(--tv-text);
            }

            #dialog_thumb_opt .settings_value_focus {
                color: var(--tv-accent-ink);
            }

            #dialog_thumb_opt .settings_arraw_div {
                width: auto;
            }

            #dialog_opt_text_end {
                width: auto;
                margin: 2.4vh 0 0;
                padding: 2vh 1.6vh 0;
                border-top: 1px solid var(--tv-line-soft);
                font-weight: 500;
                font-size: 1.6vh;
                line-height: 1.5;
                color: var(--tv-muted);
            }

            /* History settings dialog (sorting, delete...): the same card and rows as the thumbnail options */
            #dialog_hist_setting {
                background: rgba(8, 8, 10, 0.72) !important;
                font-family: 'Manrope', 'Roboto', sans-serif;
                letter-spacing: normal;
                -webkit-text-stroke: 0;
            }

            #dialog_hist_setting .dialog_period {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 64vw;
                margin: 0;
                padding: 4vh 4vh 3vh;
                text-align: left !important;
                transform: translate(-50%, -50%);
                animation: tv_dialog_in 260ms cubic-bezier(0.16, 1.2, 0.3, 1) both;
            }

            #dialog_hist_setting .strokedeline {
                text-shadow: none;
            }

            #dialog_hist_text {
                width: auto;
                margin: 0 0 2.4vh 1.6vh;
                font-family: 'Space Grotesk', 'Manrope', sans-serif;
                font-weight: 700;
                font-size: 3vh;
                color: var(--tv-text);
            }

            #dialog_hist_setting .hist_div {
                display: flex;
                align-items: center;
                gap: 1vh;
                width: 100%;
                min-height: 5.4vh;
                margin: 0.4vh 0;
                padding: 0.6vh 1.6vh;
                box-sizing: border-box;
                border: 0;
                border-image: none;
                border-radius: 1.4vh;
                line-height: normal;
                font-size: 2vh;
            }

            #dialog_hist_setting .hist_name {
                flex: 1;
                width: auto;
                margin: 0;
                font-weight: 600;
                font-size: 2vh;
                color: var(--tv-text-2);
            }

            #dialog_hist_setting .settings_summary {
                margin: 0.3vh 0 0;
                font-family: 'Manrope', 'Roboto', sans-serif;
                font-weight: 500;
                font-size: 1.5vh !important;
                color: var(--tv-muted);
            }

            #dialog_hist_setting .hist_value {
                width: auto;
                min-width: 16vw;
                margin: 0;
                border: 0;
                border-image: none;
                background-color: transparent;
                text-align: right;
                font-weight: 600;
                font-size: 1.9vh;
                line-height: normal;
                color: var(--tv-muted);
            }

            #dialog_hist_setting .settings_div_focus .hist_name {
                color: var(--tv-text);
            }

            #dialog_hist_setting .settings_value_focus {
                color: var(--tv-accent-ink);
            }

            #dialog_hist_setting .settings_arraw_div {
                width: auto;
            }

            /* Empty state (ScreensObj_addBanner with empty): a dashed card with the screen icon and the message */
            /* inset so the focus ring (1.1vh outside the card) stays clear of the pills and the rail */
            .banner_empty_holder {
                width: 100%;
                box-sizing: border-box;
                padding: 1.6vh 1.6vh 0;
            }

            .inner_banner_holder.banner_empty {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2.2vh;
                min-height: 30vh;
                padding: 4vh 6vh;
                box-sizing: border-box;
                border: 0.3vh dashed var(--tv-line) !important;
                border-radius: 2.4vh;
                background-color: var(--tv-panel) !important;
                font-family: 'Manrope', 'Roboto', sans-serif;
                -webkit-text-stroke: 0;
                text-align: center;
            }

            .banner_empty_icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 10vh;
                height: 10vh;
                border-radius: 50%;
                background-color: var(--tv-accent-tint);
                color: var(--tv-accent-ink);
            }

            .banner_empty_icon svg {
                width: 4.6vh;
                height: 4.6vh;
            }

            .banner_empty_text {
                max-width: 70vh;
                font-weight: 600;
                font-size: 2.2vh;
                line-height: 1.5;
                color: var(--tv-text-2);
            }

            .inner_banner_holder.banner_empty.stream_thumbnail_focused,
            .inner_banner_holder.banner_empty.stream_thumbnail_focused_no_ani {
                border-style: solid !important;
                border-color: transparent !important;
                background-color: var(--tv-surface) !important;

            .banner_empty.stream_thumbnail_focused .banner_empty_text,
            .banner_empty.stream_thumbnail_focused_no_ani .banner_empty_text {
                color: var(--tv-text);
            }

            /* Channel grids (followed channels, channel search, blocked channels): round avatar with the focus ring
               on the circle and the name centered below, like the account screen */
            .streams_div .stream_thumbnail_channel {
                background-color: transparent !important;
            }

            .streams_div .stream_thumbnail_channel .stream_thumbnail_channel_img {
                width: 76%;
                padding-bottom: 76%;
                margin: 4% auto 0;
                overflow: hidden;
                border-radius: 50%;
                background-color: var(--tv-card) !important;
            }

            .streams_div .stream_thumbnail_channel img.stream_img_channels {
                width: 100%;
                height: 100%;
                max-height: none;
                object-fit: cover;
                border-radius: 50%;
            }

            .streams_div .stream_thumbnail_channel.stream_thumbnail_focused,
            .streams_div .stream_thumbnail_channel.stream_thumbnail_focused_no_ani {
                background-color: transparent !important;
                border-color: transparent !important;
                box-shadow: none;
            }

            .streams_div .stream_thumbnail_focused .stream_thumbnail_channel_img,
            .streams_div .stream_thumbnail_focused_no_ani .stream_thumbnail_channel_img {
                box-shadow:
                    0 0 0 0.5vh var(--tv-bg),
                    0 0 0 1.2vh var(--tv-accent),
                    0 2vh 4vh rgba(0, 0, 0, 0.6);
            }

            .streams_div .stream_thumbnail_channel_text_holder {
                display: flex;
                justify-content: center;
                align-items: center;
                height: auto;
                padding: 0;
                bottom: 3%;
                font-family: 'Manrope', 'Roboto', sans-serif;
                letter-spacing: normal;
                -webkit-text-stroke: 0;
            }

            .streams_div .stream_info_channel_name {
                width: auto;
                max-width: 100%;
                margin: 0;
                text-align: center;
                font-family: 'Manrope', 'Roboto', sans-serif;
                font-weight: 700;
                font-size: 1.9vh;
                text-shadow: none;
                color: var(--tv-text);
                opacity: 1;
            }

            .streams_div .stream_info_channel_partner_icon img {
                width: 1.9vh !important;
                margin-left: 0.6vh;
            }

            /* Player feed (user_feed): the row of streams that slides up from the bottom of the player.
               Card positions and sizes stay with UserLiveFeed (percent based), only the look changes. */
            #user_feed {
                font-family: 'Manrope', 'Roboto', sans-serif;
                letter-spacing: normal;
                -webkit-text-stroke: 0;
            }

            #user_feed .strokedeline,
            #user_feed .strokedelinebig {
                text-shadow: none;
            }

            .user_feed {
                background: linear-gradient(0deg, rgba(8, 8, 10, 0.97) 0%, rgba(8, 8, 10, 0.88) 55%, rgba(8, 8, 10, 0) 100%);
            }

            /* No card background: rounded preview with the focus ring (SettingsColor.js), text below.
               A narrower card inside its slot gives the gap between cards. */
            #user_feed .stream_thumbnail_player_feed {
                width: 93%;
                border-radius: 0;
                background-color: transparent !important;
            }

            #user_feed .stream_thumbnail_game_feed {
                width: 88%;
                border-radius: 0;
                background-color: transparent !important;
            }

            #user_feed .stream_thumbnail_live_img,
            #user_feed .stream_thumbnail_feed_game {
                overflow: hidden;
                border-radius: 1.2vh;
                background-color: var(--tv-card);
            }

            #user_feed img.stream_img {
                border-radius: 0;
            }

            /* The stream row sat high above the tabs once its text got smaller; the game row already fits */
            .user_feed_scroll {
                bottom: 12.5%;
            }

            /* Same 4vh side margins as the player controls, so the first and last cards and their focus ring are
               not cut; card widths are a percent of this width, so they shrink a little to fit */
            .user_feed_scroll,
            .user_feed_scroll_game {
                left: 4vh;
                width: calc(100% - 8vh);
            }

            /* Previews are dimmed a little so the focused one stands out */
            #user_feed .stream_thumbnail_live_img,
            #user_feed .stream_thumbnail_feed_game {
                filter: brightness(0.72);
                transition: filter 200ms cubic-bezier(0.4, 0, 0.2, 1) 0s;
            }

            #user_feed .feed_thumbnail_focused .stream_thumbnail_live_img,
            #user_feed .feed_thumbnail_focused_no_ani .stream_thumbnail_live_img,
            #user_feed .feed_thumbnail_focused .stream_thumbnail_feed_game,
            #user_feed .feed_thumbnail_focused_no_ani .stream_thumbnail_feed_game {
                filter: none;

            #user_feed .feed_thumbnail_focused_no_ani .stream_info_live_title,

                color: var(--tv-text);

            #user_feed .stream_thumbnail_game_feed_text_holder {
                padding: 0.9vh 0.2vh 0;
                font-family: 'Manrope', 'Roboto', sans-serif;
            }

                font-weight: 700;
                font-size: 1.7vh;
                color: var(--tv-text);
                opacity: 1;
            }

            #user_feed .game_meta {
                font-size: 1.35vh;
            }

            /* Browser only refresh button for the mouse (on the TV it is hold up), a pill with icon and label */
            .feed_refresh_button {
                position: absolute;
                right: 1.6vh;
                bottom: 4.2vh;
                z-index: 999;
                display: flex;
                align-items: center;
                gap: 0.8vh;
                height: 4.4vh;
                padding: 0 1.8vh 0 1.4vh;
                border-radius: 999px;
                background-color: rgba(255, 255, 255, 0.1);
                color: var(--tv-text);
                font-weight: 600;
                font-size: 1.6vh;
                cursor: pointer;
                transition: background-color 120ms cubic-bezier(0.4, 0, 0.2, 1) 0s;
            }

            .feed_refresh_button:hover {
                background-color: var(--tv-accent);
            }

            /* BrowserTest reads the clicked id, so clicks must land on the button itself */
            .feed_refresh_button * {
                pointer-events: none;
            }

            .feed_refresh_button svg {
                width: 2.2vh;
                height: 2.2vh;
            }

            #user_feed .stream_text_holder {
                top: auto;
                transform: none;
            }

            #user_feed .stream_info_live_name {
                font-family: 'Manrope', 'Roboto', sans-serif;
                font-weight: 700;
                font-size: 1.8vh;
                color: var(--tv-text);
                opacity: 1;
            }

            /* language, game and stats lines; the language carries an inline font-size: 70% */
            #user_feed .stream_info_live {
                font-family: 'Manrope', 'Roboto', sans-serif;
                font-weight: 600;
                font-size: 1.35vh !important;
                color: var(--tv-muted);
                opacity: 1;
            }

            /* one line title keeps the cards calm, the full title is in the player */
            #user_feed .stream_info_live_title,
            #user_feed .stream_info_live_title_single_line {
                margin: 0.3vh 0 0.2vh;
                font-weight: 500;
                font-size: 1.45vh;
                line-height: 1.35;
                max-height: 1.35em;
                white-space: nowrap;
                text-overflow: ellipsis;
                color: var(--tv-text-2);
            }

            #user_feed .live_icon {
                font-size: 1.1vh;
                vertical-align: middle;
            }

            #user_feed .icon_feed_refresh {
                filter: none;
                font-family: 'Manrope', 'Roboto', sans-serif;
            }

            #feed_end {
                display: flex;
                align-items: center;
                gap: 0.6vh;
                margin-left: 4vh;
            }

            .feed_end_up_down {
                transform: none;
                opacity: 0.6;
            }

            .feed_end_name {
                transform: none;
                margin: 0;
                padding: 0.5vh 1.4vh;
                border: 0;
                border-radius: 999px;
                font-weight: 600;
                font-size: 1.7vh;
                color: var(--tv-muted);

            .feed_end_name.feed_end_name_focus {
